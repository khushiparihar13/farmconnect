<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Connect - Login and Sign Up</title>
    <link rel="stylesheet" href="login_sign.css">
</head>
<body>

    <div class="container">
        <!-- Login Form -->
        <div id="login-form" class="form-container">
            <h2>Login</h2>
            <form action="" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" name="login">Login</button>
            </form>
        </div>
        <!-- Sign-Up Form -->
        <div id="signup-form" class="form-container" style="display: none;">
            <h2>Sign Up</h2>
            <form action="signin.php" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" name="signup">Sign Up</button>
                <!-- <a href="home.html">Sign Up</a> -->
            </form>
        </div>
        <!-- Toggle Button -->
        <div class="toggle-button">
            <a href="#" onclick="toggleForms()">Don't have an account? Sign Up</a>
        </div>
    </div>

    <script>
        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const toggleButton = document.querySelector('.toggle-button a');

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                toggleButton.textContent = "Don't have an account? Sign Up";
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                toggleButton.textContent = "Already have an account? Login";
            }
        }
    </script>
</body>
</html>
